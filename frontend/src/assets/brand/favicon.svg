<!-- ProqnozAI favicon: the Velocity V2 app icon (Figma 162:103); kept identical to velocity-icon.svg (unit test). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- CSS linear-gradient(120deg) on a 512 square: line through the centre, length 512·(sin60°+cos60°). -->
    <linearGradient id="pq-icon-bg" x1="-46.85" y1="81.15" x2="558.85" y2="430.85" gradientUnits="userSpaceOnUse">
      <stop offset="0.058565" stop-color="#EAF3C6"/>
      <stop offset="0.4612" stop-color="#CDEAC6"/>
      <stop offset="0.79063" stop-color="#A0CEC9"/>
    </linearGradient>
    <clipPath id="pq-icon-clip">
      <rect width="512" height="512" rx="116"/>
